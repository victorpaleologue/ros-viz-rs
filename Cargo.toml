# Published to crates.io as `ros-viz` (so `cargo install ros-viz` is the short
# command). The repository, distributed packages, app bundles and the npm
# package keep the established `ros-viz-rs` name — see the [lib], [[bin]] and
# [package.metadata.*] sections below, which pin those back.
[package]
name = "ros-viz"
version = "1.3.3"
edition = "2024"
# Two bin targets (ros-viz + the ros-viz-rs alias) make a bare `cargo run`
# ambiguous; pick the canonical one so `cargo run`/`cargo run --release` keep
# working as documented.
default-run = "ros-viz"
description = "Generic ROS 2 robot visualizer — Bevy + egui, URDF + forward kinematics, no ROS installation required"
license = "MIT"
repository = "https://github.com/victorpaleologue/ros-viz-rs"
readme = "README.md"
keywords = ["ros", "ros2", "robot", "urdf", "visualization"]
categories = ["visualization", "science::robotics"]
exclude = ["test-data", ".test_outputs", ".github", "docs", "android"]

[package.metadata.deb]
# Keep the Debian package name independent of the crate rename to `ros-viz`.
name = "ros-viz-rs"
extended-description = """\
Visualize any ROS 2 robot: URDF rendering with meshes, forward kinematics \
driven by /joint_states, and a live topic inspector. Talks DDS directly — \
no ROS installation needed."""
depends = "$auto"
section = "science"

# cargo-generate-rpm reads this; `auto-req` lets rpmbuild discover the shared
# library dependencies (alsa, udev, wayland/X) from the linked binary.
[package.metadata.generate-rpm]
# Keep the RPM package name as `ros-viz-rs` despite the crate rename.
name = "ros-viz-rs"
assets = [
    { source = "target/release/ros-viz-rs", dest = "/usr/bin/ros-viz-rs", mode = "0755" },
    { source = "LICENSE", dest = "/usr/share/doc/ros-viz-rs/LICENSE", mode = "0644" },
    { source = "README.md", dest = "/usr/share/doc/ros-viz-rs/README.md", mode = "0644" },
]
auto-req = "auto"

# Android APK metadata, read by the packaging tool (cargo-apk / xbuild). The
# native library is compiled with `--no-default-features --features rosbridge`
# (DDS multicast is unreliable on mobile; rosbridge is the transport, as on
# the web). INTERNET is the one runtime permission the rosbridge client needs.
[package.metadata.android]
package = "eu.palaio.rosvizrs"
build_targets = ["aarch64-linux-android"]
apk_label = "ros-viz-rs"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "ros-viz-rs"


[features]
default = ["ros2", "rosbridge"]
# Native DDS transport via ros2-client/rustdds. Off for wasm builds.
ros2 = ["dep:ros2-client", "dep:rustdds", "dep:futures", "dep:async-channel"]
# rosbridge JSON/WebSocket transport; works natively and on wasm.
rosbridge = ["dep:ewebsock"]
# Native Zenoh transport for rmw_zenoh ROS 2 systems. Heavy deps (async
# runtime), off by default; native only.
zenoh = ["dep:zenoh", "dep:zenoh-ext", "dep:cdr", "dep:tokio"]
# Use the WebGPU wasm backend instead of WebGL2. WebGPU is required for the
# egui topics panel to render in the browser (WebGL2 lacks
# TEXTURE_BINDING_ARRAY). The web build ships both: a universal WebGL2
# bundle (3D view everywhere) and a WebGPU bundle (adds the panel), selected
# by adapter detection in web/index.html. Inert on native.
webgpu = ["bevy/webgpu"]

[dependencies]
bevy_egui = "0.39"
# Bevy must be declared here (not only in a [target.*] table): its derive
# macros locate the `bevy` crate path via BevyManifest, which scans only
# [dependencies]/[dev-dependencies]. The feature list is Bevy's `default`
# (= the 2d ∪ 3d ∪ ui aggregates) expanded by hand with a single omission,
# `android-game-activity`. That backend is baked into `default_platform`, can't
# be compiled alongside native-activity, and is replaced on Android by
# `android-native-activity` in the [target.'cfg(target_os = "android")'] table.
# On desktop/web the omission is inert (android-activity isn't a dependency
# there), so those builds are byte-for-byte the previous default.
bevy = { version = "0.18", default-features = false, features = [
    # 2d ∪ 3d ∪ ui, minus the `default_platform` aggregate (expanded below):
    "default_app",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "audio",
    "picking",
    # `default_platform`, minus `android-game-activity`:
    "std",
    "android_shared_stdcxx",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "sysinfo_plugin",
] }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde derives Deserialize for arrays only up to 32 elements; ROS covariance
# fields are float64[36], so BigArray fills the gap (CDR-compatible: both
# encode fixed arrays as serde tuples, i.e. without a length prefix).
serde-big-array = "0.5"
thiserror = "1"
ros2-client = { version = "0.8", optional = true }
rustdds = { version = "0.11", optional = true }
urdf-rs = "0.9"
k = "0.32"
nalgebra = { version = "0.33", features = ["serde"] }
mesh-loader = "0.1"
image = { version = "0.24", default-features = false, features = ["png"] }
async-channel = { version = "2.3", optional = true }
futures = { version = "0.3", optional = true }
ewebsock = { version = "0.8", optional = true }
# Native Zenoh transport (rmw_zenoh). zenoh 1.x is async (tokio); cdr decodes
# the CDR payloads into our ros_msgs structs.
# `unstable` exposes the AdvancedSubscriber API used for transient-local.
zenoh = { version = "1", features = ["unstable"], optional = true }
# AdvancedSubscriber: fetches transient-local history (rmw_zenoh latches
# /robot_description via zenoh-ext AdvancedPublisher caching).
zenoh-ext = { version = "1", features = ["unstable"], optional = true }
cdr = { version = "0.2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
ron = "0.12.1"

# Android uses the framework's NativeActivity rather than Bevy's default
# GameActivity (which needs the games-activity AAR and draws edge-to-edge under
# the system bars). This adds the backend to the base `bevy` dependency above;
# default-features stays off, so `android-game-activity` is never pulled in and
# the two backends can't clash.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.18", default-features = false, features = ["android-native-activity"] }
# Exposes `ANDROID_APP` (the android-activity `AndroidApp`), used to read the
# inset-aware content rect so egui panels avoid the system bars.
bevy_android = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# The library keeps the `ros_viz_rs` name even though the package is now
# `ros-viz`: it keeps every `use ros_viz_rs::...` (tests, examples, the bins)
# compiling unchanged, and keeps the wasm-pack output filenames stable
# (web/index.html imports `pkg/ros_viz_rs.js`), so the live demo is untouched.
[lib]
name = "ros_viz_rs"
crate-type = ["cdylib", "rlib"]

# Two binaries with identical behaviour. `ros-viz` is the short command
# installed by `cargo install ros-viz`; `ros-viz-rs` is an alias kept so the
# distributed packages, the macOS/Windows artifacts and the existing
# scripts/docs that call the binary by that name keep working. Each has its own
# source file (`src/main.rs` and `src/bin/ros-viz-rs.rs`) so no single file is
# claimed by two targets — Cargo warns when it is.
[[bin]]
name = "ros-viz"
path = "src/main.rs"

[[bin]]
name = "ros-viz-rs"
path = "src/bin/ros-viz-rs.rs"

[dev-dependencies]
chrono = ">=0.4.35"
tempfile = "3"
# Only examples use an async runtime; the library itself is sync.
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread"] }
tungstenite = "0.29"
