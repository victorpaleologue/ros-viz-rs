[package]
name = "ros-viz-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["render", "ros", "urdf"]
ros = ["ros2-client"]
ui = ["bevy_egui"]
urdf = ["urdf-rs", "k", "nalgebra", "mesh-loader"]
render = []
k = ["dep:k"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
bevy = { version = "0.15", default-features = true }
bevy_egui = { version = "0.28", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
ros2-client = { version = "0.8", optional = true }
urdf-rs = { version = "0.9", optional = true }
k = { version = "0.32", optional = true }
nalgebra = { version = "0.33", optional = true, features = ["serde"] }
mesh-loader = { version = "0.1", optional = true }
image = { version = "0.24", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
