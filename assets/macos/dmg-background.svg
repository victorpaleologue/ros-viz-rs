<svg width="660" height="420" viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2026"/>
      <stop offset="1" stop-color="#121419"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a7ba6"/>
      <stop offset="1" stop-color="#61b3ff"/>
    </linearGradient>
  </defs>
  <rect width="660" height="420" fill="url(#bg)"/>

  <!-- faint grid floor, echoing the visualizer -->
  <g stroke="#2a2f3a" stroke-width="1" opacity="0.5">
    <path d="M0 330 H660 M0 360 H660 M0 395 H660"/>
    <path d="M80 310 L20 420 M180 310 L150 420 M280 310 L275 420 M380 310 L400 420 M480 310 L525 420 M580 310 L650 420"/>
  </g>

  <text x="36" y="64" font-family="-apple-system, 'Helvetica Neue', sans-serif"
        font-size="28" font-weight="700" fill="#e6e8ee">ros-viz-rs</text>
  <text x="36" y="92" font-family="-apple-system, 'Helvetica Neue', sans-serif"
        font-size="15" fill="#9aa1ad">ROS 2 robot visualizer</text>

  <!-- drag arrow between icon slots (icons land at x=165 and x=495, y=220) -->
  <g>
    <path d="M 252 220 H 388" stroke="url(#arrow)" stroke-width="10"
          stroke-linecap="round"/>
    <path d="M 376 196 L 412 220 L 376 244 Z" fill="#61b3ff"/>
  </g>

  <text x="330" y="330" text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', sans-serif"
        font-size="14" fill="#9aa1ad">Drag the app into Applications to install</text>
</svg>
