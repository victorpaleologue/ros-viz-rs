# Builds the wasm demo and deploys web/ to GitHub Pages on main pushes.
# Requires Pages to be enabled for the repo with "GitHub Actions" as the
# source (Settings > Pages > Build and deployment).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # wasm release build ~8-12 min cold, a few warm.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build wasm package
        run: |
          wasm-pack build --target web --out-dir web/pkg -- \
            --no-default-features --features rosbridge
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
