# Tags main with vX.Y.Z from Cargo.toml and publishes release artifacts in
# one workflow: tags pushed with GITHUB_TOKEN cannot trigger other workflows
# (GitHub's recursion guard), so tagging and releasing must share a run.
# The version-bump gate in ci.yml guarantees each merged PR carries a fresh
# version, hence one tag per merge.
#
# Publishing steps that need maintainer-provided secrets are
# continue-on-error so the GitHub release itself always completes:
# - crates.io needs the CARGO_REGISTRY_TOKEN secret
# - npm (wasm package) needs the NPM_TOKEN secret
name: Release

on:
  push:
    branches: [main]
  # Manual (re)build of artifacts for an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)build artifacts for"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag the Cargo.toml version if new
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag"; then
            echo "Tag $tag already exists; skipping release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  github-release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --generate-notes

  crates-io:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Will fail until CARGO_REGISTRY_TOKEN is configured in repo secrets.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  macos-app:
    needs: [tag, github-release]
    if: needs.tag.outputs.created == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Bundle .app and drag-to-install .dmg
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          brew install create-dmg
          ./scripts/package_macos.sh "${TAG#v}" arm64
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release upload "$TAG" ros-viz-rs-*.dmg --clobber

  linux-deb:
    needs: [tag, github-release]
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release upload "$TAG" target/debian/*.deb --clobber

  windows-exe:
    needs: [tag, github-release]
    if: needs.tag.outputs.created == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rustdds -> pnet needs the Npcap SDK's Packet.lib to link on Windows
      # (https://github.com/libpnet/libpnet#windows). Runtime DDS interface
      # enumeration also wants Npcap installed on the user's machine.
      - name: Install Npcap SDK
        shell: bash
        run: |
          curl -sLO https://npcap.com/dist/npcap-sdk-1.13.zip
          unzip -q npcap-sdk-1.13.zip -d npcap-sdk
          echo "LIB=${GITHUB_WORKSPACE}\\npcap-sdk\\Lib\\x64" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          cp target/release/ros-viz-rs.exe "ros-viz-rs-$version-windows-x86_64.exe"
          gh release upload "$TAG" "ros-viz-rs-$version-windows-x86_64.exe" --clobber

  npm:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Will fail until NPM_TOKEN is configured in repo secrets.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build wasm package
        run: |
          cargo install wasm-pack --locked
          wasm-pack build --target web --out-dir web/pkg -- \
            --no-default-features --features rosbridge
      - name: Publish to npm
        working-directory: web/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
