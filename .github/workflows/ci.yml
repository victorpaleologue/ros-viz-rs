name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    # Bevy cold build: clippy compiles the whole dep tree (~15-20 min cold,
    # a few minutes warm with rust-cache).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # alsa + udev headers are required to compile Bevy on Linux.
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # The crate must build for every transport combination and for the
      # browser (no DDS on wasm).
      - name: feature combinations
        run: |
          cargo clippy --lib --no-default-features -- -D warnings
          cargo clippy --lib --no-default-features --features ros2 -- -D warnings
          cargo clippy --lib --no-default-features --features rosbridge -- -D warnings
          # Zenoh is native-only (heavy async deps). Lint the library standalone
          # to keep the transport modular, and lint all targets in the real
          # shipping config (zenoh additive on defaults) so the integration test
          # is covered.
          cargo clippy --lib --no-default-features --features zenoh -- -D warnings
          cargo clippy --all-targets --features zenoh -- -D warnings

      - name: wasm target
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --lib --no-default-features --features rosbridge \
            --target wasm32-unknown-unknown

  test-linux:
    runs-on: ubuntu-latest
    # Bevy cold build + tests: ~25-40 min cold, much less warm.
    timeout-minutes: 60
    env:
      RUST_LOG: error
      # tests/visual_regression.rs renders offscreen via wgpu; on the GPU-less
      # runner it uses lavapipe (mesa software Vulkan rasterizer).
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5

      # alsa + udev for Bevy; mesa-vulkan-drivers provides lavapipe for
      # headless GPU render tests.
      - name: Install Bevy system dependencies and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --lib

      # Reference images under test-data/reference were generated on macOS
      # Metal; lavapipe output can exceed the RMSE budget, so this step is
      # informational on Linux. The strict gate for these tests is test-macos.
      - name: Visual regression (informational on Linux)
        continue-on-error: true
        run: cargo test --test visual_regression

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-outputs-linux
          path: .test_outputs/
          if-no-files-found: ignore

  test-macos:
    # macos-latest (macos-14+, arm64) exposes Metal through a paravirtualized
    # GPU (Apple5 feature set) — enough for wgpu/Bevy offscreen rendering, and
    # references were generated on macOS Metal, so the full suite runs strictly
    # here. If the paravirtual device ever drifts outside the RMSE budget,
    # mirror the Linux continue-on-error split instead of regenerating images.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUST_LOG: error
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-outputs-macos
          path: .test_outputs/
          if-no-files-found: ignore

  docker-integration:
    # End-to-end against real ROS 2 robot stacks in Docker containers
    # (tests/docker_integration.rs): a UR5e description stack and a fake NAO
    # running naoqi_driver2's emulation mode. Linux-only (needs --network
    # host for DDS). Expect ~45-60 min cold (the fake NAO image
    # colcon-builds naoqi_driver + deps from source, plus the Bevy dep
    # tree), ~20-30 min with warm rust-cache and Docker layer cache.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_LOG: error
      # The snapshot renders offscreen via wgpu; on the GPU-less runner it
      # uses lavapipe (mesa software Vulkan rasterizer).
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5

      # alsa + udev for Bevy; mesa-vulkan-drivers provides lavapipe for
      # headless GPU render tests.
      - name: Install Bevy system dependencies and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Docker integration tests
        run: cargo test --test docker_integration -- --ignored

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-outputs-docker-integration
          path: .test_outputs/
          if-no-files-found: ignore

  android-build:
    # Cross-compiles the Android library with the NDK, so the
    # `#[cfg(target_os = "android")]` code is type-checked on every PR. Builds
    # the shipped config — default features (native DDS + rosbridge), matching
    # the APK — so a DDS-on-Android compile break is caught here, fast, not only
    # in the slower APK job.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build Android library (arm64, rosbridge)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a build --release --lib

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check that Cargo.toml version was bumped
        run: |
          git fetch --depth=1 origin main
          pr_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          main_version=$(git show FETCH_HEAD:Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)
          echo "main: $main_version, PR: $pr_version"
          if [ "$pr_version" = "$main_version" ]; then
            echo "::error file=Cargo.toml::Cargo.toml version ($pr_version) matches main." \
              "Please bump the version in Cargo.toml before merging."
            exit 1
          fi
