# Builds an installable Android APK and smoke-tests it on an emulator so a
# startup crash is caught in CI (with logcat) rather than only on a physical
# device. Builds both arm64 (real phones) and x86_64 (emulator).
#
# Build variant follows the trigger: pushes to `main` build a (debug-signed)
# RELEASE APK; everything else — pull requests and manual runs — builds a
# DEBUG APK. Release APKs are signed with the auto-generated debug keystore so
# they stay installable/testable without release-signing secrets.
name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      variant: ${{ steps.variant.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - name: Select build variant (release on main, debug otherwise)
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=release" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "name=debug" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build native libraries (arm64 + x86_64, rosbridge) into jniLibs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs \
            build --release --lib --no-default-features --features rosbridge
          # Our native deps (oboe/wgpu) link the C++ shared runtime, which
          # Android does not provide to apps — bundle it per ABI or dlopen of
          # libros_viz_rs.so fails with "libc++_shared.so not found".
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          cp "$sysroot/aarch64-linux-android/libc++_shared.so" android/app/src/main/jniLibs/arm64-v8a/
          cp "$sysroot/x86_64-linux-android/libc++_shared.so"  android/app/src/main/jniLibs/x86_64/

      - name: Assemble ${{ steps.variant.outputs.name }} APK
        working-directory: android
        run: gradle ${{ steps.variant.outputs.task }} --no-daemon

      - name: Stage APK
        run: |
          apk=$(find "android/app/build/outputs/apk/${{ steps.variant.outputs.name }}" -name '*.apk' | head -1)
          test -n "$apk" || { echo "no APK produced"; exit 1; }
          cp "$apk" ros-viz-rs.apk

      - uses: actions/upload-artifact@v6
        with:
          name: ros-viz-rs-android-apk-${{ steps.variant.outputs.name }}
          path: ros-viz-rs.apk
          if-no-files-found: error

  smoke-test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: ros-viz-rs-android-apk-${{ needs.apk.outputs.variant }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch emulator and check the app starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Single line: the action runs `script` line by line, so the real
          # logic lives in the committed bash file.
          script: bash android/scripts/smoke-test.sh

      # The framebuffer grab from the smoke test, so the rendered UI can be
      # eyeballed (portrait + status bar, like a real phone) without a device.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ros-viz-rs-android-screenshot
          path: app-screenshot.png
          if-no-files-found: warn
