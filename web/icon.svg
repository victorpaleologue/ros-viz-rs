<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a33"/>
      <stop offset="1" stop-color="#13151a"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecbff"/>
      <stop offset="1" stop-color="#4a9ae8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="eyeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS rounded-square tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- subtle top sheen -->
  <path d="M232 0 h560 a232 232 0 0 1 232 232 v40 q-512 120 -1024 0 v-40 a232 232 0 0 1 232 -232 z"
        fill="#ffffff" opacity="0.025"/>

  <!-- discovery arcs (ROS-ish signal), behind the head -->
  <g stroke="#61b3ff" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M 240 332 a 272 272 0 0 1 544 0" opacity="0.35"/>
    <path d="M 326 332 a 186 186 0 0 1 372 0" opacity="0.7"/>
  </g>

  <g filter="url(#glyphShadow)">
    <!-- antenna -->
    <rect x="496" y="268" width="32" height="92" rx="16" fill="url(#head)"/>
    <circle cx="512" cy="252" r="40" fill="url(#head)"/>

    <!-- head -->
    <rect x="232" y="352" width="560" height="420" rx="120" fill="url(#head)"/>

    <!-- ears -->
    <rect x="176" y="486" width="56" height="152" rx="28" fill="url(#head)"/>
    <rect x="792" y="486" width="56" height="152" rx="28" fill="url(#head)"/>

    <!-- visor -->
    <rect x="296" y="424" width="432" height="276" rx="88" fill="url(#visor)"/>

    <!-- eyes -->
    <g filter="url(#eyeGlow)">
      <circle cx="424" cy="562" r="54" fill="#cfe9ff"/>
      <circle cx="600" cy="562" r="54" fill="#cfe9ff"/>
    </g>
    <circle cx="424" cy="562" r="22" fill="#61b3ff"/>
    <circle cx="600" cy="562" r="22" fill="#61b3ff"/>

    <!-- smile -->
    <path d="M 462 648 q 50 34 100 0" stroke="#9fd2ff" stroke-width="18"
          stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>
